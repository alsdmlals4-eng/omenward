<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMENWARD 베기 모션 검토</title>
<style>body{margin:24px;background:#eee9df;color:#263047;font:16px/1.6 system-ui}main{max-width:900px;margin:auto}.frame{width:min(460px,90vw);aspect-ratio:1;background:url('slash-sheet.png') 0% 0%/200% 200%;border:1px solid #bbb}.small{width:112px}.views{display:flex;align-items:end;gap:24px;flex-wrap:wrap}button{font:inherit;padding:8px 14px;margin:8px 8px 8px 0}img{max-width:100%}</style>
<main><h1>방패병 · 대각선 내려베기</h1><p>찌르기 시안을 대신하는 베기 키포즈 검토본입니다. 3개 새 포즈와 기존 대기 자세를 연결했습니다. 불투명 후보이며 실제 게임 화면이 아닙니다.</p><div class="views"><div class="frame" role="img" aria-label="베기 키포즈 확대"></div><div><div class="frame small" role="img" aria-label="112픽셀 베기 키포즈"></div><p>112px 참고</p></div></div><p id="state" aria-live="polite">준비 · 200ms</p><button id="play">재생</button><button id="step">다음 포즈</button><button id="reset">처음</button><p>관찰용 시간: 200 / 70 / 150 / 280ms. 게임 공격속도 확정값이 아닙니다. 자동 재생하지 않습니다.</p><details><summary>시트·미완료 항목</summary><img src="slash-sheet.png" alt="올려 준비, 베기 중간, 낮은 후속 자세, 대기 복귀 순서의 시트"><p>검 길이·갑옷/천 장식의 프레임 차이, 투명화, 추가 연결 프레임과 발 피벗 검증이 남았습니다. 마지막은 별도 회복 동작이 아닌 기존 대기 자세입니다.</p></details></main>
<script>const durations=[200,70,150,280],names=['준비','베기 중간','후속 자세','대기 복귀'],positions=['0% 0%','100% 0%','0% 100%','100% 100%'];let index=0,playing=false,timer=null;function show(){document.querySelectorAll('.frame').forEach(el=>el.style.backgroundPosition=positions[index]);document.getElementById('state').textContent=`${names[index]} · ${durations[index]}ms`;}function stop(){playing=false;clearTimeout(timer);timer=null;document.getElementById('play').textContent='재생';}function tick(){timer=setTimeout(()=>{index=(index+1)%4;show();if(playing)tick();},durations[index]);}document.getElementById('play').onclick=()=>{if(playing){stop();return;}playing=true;document.getElementById('play').textContent='정지';tick();};document.getElementById('step').onclick=()=>{stop();index=(index+1)%4;show();};document.getElementById('reset').onclick=()=>{stop();index=0;show();};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});</script></html>
