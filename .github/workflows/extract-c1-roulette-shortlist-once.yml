name: Extract C1 Roulette Shortlist Once

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/_extract_c1_roulette_shortlist.py"
      - ".github/workflows/extract-c1-roulette-shortlist-once.yml"

permissions:
  contents: write

jobs:
  extract:
    if: github.head_ref == 'agent/c1-approved-roulette-contract-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Extract C1 shortlist
        shell: bash
        run: |
          set +e
          python tools/_extract_c1_roulette_shortlist.py > c1-shortlist.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 160 c1-shortlist.log > docs/_C1_SHORTLIST_FAILURE.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/_C1_SHORTLIST_FAILURE.log
            git commit -m "record C1 shortlist extraction failure" || true
            git push origin HEAD:agent/c1-approved-roulette-contract-recovery
          fi
          exit $status
