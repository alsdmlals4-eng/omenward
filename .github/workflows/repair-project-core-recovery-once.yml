name: Repair Project Core Recovery Once

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/_repair_project_core_recovery.py"
      - ".github/workflows/repair-project-core-recovery-once.yml"

permissions:
  contents: write

concurrency:
  group: omenward-project-core-repair-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'agent/project-core-canon-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore preserved documentation and validate no-loss contracts
        if: ${{ hashFiles('tools/_repair_project_core_recovery.py') != '' }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/_repair_project_core_recovery.py")
          text = path.read_text(encoding="utf-8")
          old = "### D. 이미 구현된 기술 기준선\n\n| 항목 | 현재 상태 |"
          new = "### D. 이미 구현된 기술 기준선\n\n상태 요약: `Godot 4.7.1·Compatibility·960×540` 기술 기준선은 실제 저장소에 존재하며, 최신 runtime 재검증은 별도 증거로 남긴다.\n\n| 항목 | 현재 상태 |"
          if text.count(old) != 1:
              raise RuntimeError(f"expected one implemented-baseline marker, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
          set +e
          python tools/_repair_project_core_recovery.py > project-core-repair.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            mkdir -p docs
            tail -n 180 project-core-repair.log > docs/_CORE_REPAIR_FAILURE.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/_CORE_REPAIR_FAILURE.log
            git commit -m "record project core no-loss repair failure" || true
            git push origin HEAD:agent/project-core-canon-recovery
          fi
          exit $status
