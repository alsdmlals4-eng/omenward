name: Validate active integrated contract v4.3

on:
  pull_request:
    paths:
      - ".github/workflows/validate-active-integrated-contract-v4-3.yml"
      - "docs/process/ACTIVE_INTEGRATED_CONTRACT_BINDING_2026-08-06.md"
      - "docs/operations/ACTIVE_INTEGRATED_CONTRACT_STATE.v1.json"
      - "docs/reviews/ADVERSARIAL_INTEGRATED_CONTRACT_V4_3_ACTIVATION_REVIEW_2026-08-06.md"
      - "docs/superpowers/plans/2026-08-06-activate-integrated-contract-v4-3.md"
      - "tests/python/test_active_integrated_contract_v4_3.py"
      - "tools/validate_active_integrated_contract_v4_3.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contract-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce exact contract-binding scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          allowed = {
              ".github/workflows/validate-active-integrated-contract-v4-3.yml",
              "docs/process/ACTIVE_INTEGRATED_CONTRACT_BINDING_2026-08-06.md",
              "docs/operations/ACTIVE_INTEGRATED_CONTRACT_STATE.v1.json",
              "docs/reviews/ADVERSARIAL_INTEGRATED_CONTRACT_V4_3_ACTIVATION_REVIEW_2026-08-06.md",
              "docs/superpowers/plans/2026-08-06-activate-integrated-contract-v4-3.md",
              "tests/python/test_active_integrated_contract_v4_3.py",
              "tools/validate_active_integrated_contract_v4_3.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]],
                  text=True,
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected or missing:
              raise SystemExit(f"scope mismatch unexpected={unexpected} missing={missing}")
          print("contract binding scope=PASS files=7")
          PY

      - name: Compile validator and focused test
        run: |
          python -m py_compile \
            tools/validate_active_integrated_contract_v4_3.py \
            tests/python/test_active_integrated_contract_v4_3.py

      - name: Run bootstrap contract tests
        run: python -m unittest tests.python.test_active_integrated_contract_v4_3

      - name: Validate v4.3 active binding
        run: python tools/validate_active_integrated_contract_v4_3.py --contract
