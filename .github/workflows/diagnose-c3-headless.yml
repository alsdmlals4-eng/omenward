name: Diagnose Repaired C3 Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-c3-headless.yml"
      - "tools/_repair_c3_stage_run_types.py"
      - "tests/headless/c3_core_ux_test.gd"
      - "scripts/core/stage_run.gd"
      - "scripts/core/core_ux_service.gd"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/c3-core-ux-minimum'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c3-core-ux-minimum
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply repairs and capture isolated output
        shell: bash
        run: |
          set +e
          rm -f docs/_C3_HEADLESS_DIAGNOSTIC.log
          python tools/_repair_c3_stage_run_types.py > /tmp/c3-runtime.log 2>&1
          repair_status=$?
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" -o godot.zip >> /tmp/c3-runtime.log 2>&1
          unzip -q godot.zip >> /tmp/c3-runtime.log 2>&1
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --editor --quit >> /tmp/c3-runtime.log 2>&1
          timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . -s res://tests/headless/c3_core_ux_test.gd >> /tmp/c3-runtime.log 2>&1
          test_status=$?
          {
            echo "repair_status=${repair_status}"
            echo "test_status=${test_status}"
            tail -n 180 /tmp/c3-runtime.log
          } > /tmp/c3-diagnostic.log
          git fetch origin agent/c3-core-ux-minimum
          git reset --hard origin/agent/c3-core-ux-minimum
          cp /tmp/c3-diagnostic.log docs/_C3_HEADLESS_DIAGNOSTIC.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_C3_HEADLESS_DIAGNOSTIC.log
          git commit -m "record C3 runtime assertion diagnostic"
          git push origin HEAD:agent/c3-core-ux-minimum
          exit 1
