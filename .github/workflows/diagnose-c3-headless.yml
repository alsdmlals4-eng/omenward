name: Diagnose C3 Headless

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-c3-headless.yml"
      - "tests/headless/c3_core_ux_test.gd"
      - "scripts/**"
      - "data/**"
      - "scenes/**"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/c3-core-ux-minimum'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1 Standard
        shell: bash
        run: |
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Run C3 headless test with timeout
        shell: bash
        run: |
          set -euo pipefail
          echo "=== START C3 ==="
          timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . -s res://tests/headless/c3_core_ux_test.gd
          echo "=== PASS C3 ==="
