name: Validate Project Core Documentation

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "!docs/base/**"
      - "!docs/BASE_RULES_VERSION.md"
      - "tools/validate_project_core_docs.py"
      - "tools/validate_ci_usage_contract.py"
      - "tests/python/test_project_core_docs.py"
      - "tests/python/test_ci_usage_contract.py"
      - "tests/python/test_building_branch_canon.py"
      - "tests/python/test_troop_role_canon.py"
      - "tests/python/test_tactical_skill_mana_canon.py"
      - "tests/python/test_stage_end_merchant_canon.py"
      - "tests/python/test_first_10_15_minutes_flow_canon.py"
      - ".github/workflows/validate-project-core-docs.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "!docs/base/**"
      - "!docs/BASE_RULES_VERSION.md"
      - "tools/validate_project_core_docs.py"
      - "tools/validate_ci_usage_contract.py"
      - "tests/python/test_project_core_docs.py"
      - "tests/python/test_ci_usage_contract.py"
      - "tests/python/test_building_branch_canon.py"
      - "tests/python/test_troop_role_canon.py"
      - "tests/python/test_tactical_skill_mana_canon.py"
      - "tests/python/test_stage_end_merchant_canon.py"
      - "tests/python/test_first_10_15_minutes_flow_canon.py"
      - ".github/workflows/validate-project-core-docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile documentation contracts
        run: python -m py_compile tools/validate_project_core_docs.py tools/validate_ci_usage_contract.py tests/python/test_project_core_docs.py tests/python/test_ci_usage_contract.py tests/python/test_building_branch_canon.py tests/python/test_troop_role_canon.py tests/python/test_tactical_skill_mana_canon.py tests/python/test_stage_end_merchant_canon.py tests/python/test_first_10_15_minutes_flow_canon.py
      - name: Validate project core and current-state documents
        run: python tools/validate_project_core_docs.py
      - name: Validate CI usage contract
        run: python tools/validate_ci_usage_contract.py
      - name: Run documentation and CI mutation tests
        run: python -m unittest tests.python.test_project_core_docs tests.python.test_ci_usage_contract tests.python.test_building_branch_canon tests.python.test_troop_role_canon tests.python.test_tactical_skill_mana_canon tests.python.test_stage_end_merchant_canon tests.python.test_first_10_15_minutes_flow_canon -v
      - name: Check whitespace
        run: git diff --check
