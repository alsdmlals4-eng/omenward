name: Diagnose C1 Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "tests/headless/roulette_contract_test.gd"
      - "tests/headless/stage_run_test.gd"
      - ".github/workflows/diagnose-c1-regression.yml"

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/c1-approved-roulette-contract-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c1-approved-roulette-contract-recovery
          fetch-depth: 0
      - name: Install Godot 4.7.1 Standard
        shell: bash
        run: |
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --editor --quit >/tmp/import.log 2>&1
      - name: Capture isolated regressions
        shell: bash
        run: |
          set +e
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . -s res://tests/headless/roulette_contract_test.gd >/tmp/roulette.log 2>&1
          roulette_status=$?
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . -s res://tests/headless/stage_run_test.gd >/tmp/stage.log 2>&1
          stage_status=$?
          {
            echo "roulette_status=${roulette_status}"
            echo "stage_status=${stage_status}"
            echo "--- roulette tail ---"
            tail -n 80 /tmp/roulette.log
            echo "--- stage tail ---"
            tail -n 80 /tmp/stage.log
          } > docs/_C1_REGRESSION_DIAG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_C1_REGRESSION_DIAG.txt
          git commit -m "record isolated C1 regression diagnosis" || true
          git push origin HEAD:agent/c1-approved-roulette-contract-recovery
          if [ "$roulette_status" -ne 0 ] || [ "$stage_status" -ne 0 ]; then
            exit 1
          fi
