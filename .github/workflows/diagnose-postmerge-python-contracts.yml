name: Diagnose Postmerge Python Contracts

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-postmerge-python-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false

      - name: Build test-file matrix
        id: matrix
        shell: python
        run: |
          import glob
          import json
          import os

          files = sorted(glob.glob("tests/python/test_*.py"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("matrix=" + json.dumps({"file": files}, separators=(",", ":")), file=output)

  module:
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    name: contract ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run isolated contract module
        run: python "${{ matrix.file }}"
