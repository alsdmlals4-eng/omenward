name: Validate Project Base Adapter

on:
  pull_request:
    paths:
      - "skills/PROJECT_BASE_ADAPTER.json"
      - "skills/BASE_V9_ADAPTER.json"
      - "skills/PROJECT_BASE_SKILL_ADAPTER.json"
      - "skills/PROJECT_SKILL_SNAPSHOT.json"
      - "docs/PROJECT_OPERATING_DASHBOARD.html"
      - "docs/PROJECT_OPERATING_HEALTH.json"
      - "docs/operations/PROJECT_BASE_ADAPTER_SHEET_SYNC_EVIDENCE_2026-08-08.json"
      - "docs/operations/ACTIVE_INTEGRATED_CONTRACT_STATE.v1.json"
      - "docs/PROJECT_CANON_DECISION_LEDGER.md"
      - "docs/process/ACTIVE_INTEGRATED_CONTRACT_BINDING_2026-08-06.md"
      - "docs/approvals/PROJECT_PROTECTED_CHANGE_APPROVAL_GLOBAL_ROSTER_AND_STRATEGIC_MAP_2026-08-30.json"
      - "tests/test_base_v9_adoption.py"
      - "tests/test_base_v942_planning_first_adoption.py"
      - "tests/test_base_v943_first_prompt_adoption.py"
      - "tests/test_base_v944_reuse_first_adoption.py"
      - "tests/python/test_project_base_adapter_freshness.py"
      - "tests/python/test_active_integrated_contract_v4_4.py"
      - "tools/validate_active_integrated_contract_v4_4.py"
      - ".github/workflows/validate-project-base-adapter.yml"

permissions:
  contents: read

concurrency:
  group: project-base-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run project adapter freshness contract
        run: |
          python -m unittest \
            tests.test_base_shared_skill_adapter \
            tests.test_base_shared_external_ai_adapter \
            tests.test_base_v94_ai_operations_adoption \
            tests.test_base_v9_adoption \
            tests.test_base_v942_planning_first_adoption \
            tests.test_base_v943_first_prompt_adoption \
            tests.test_base_v944_reuse_first_adoption \
            tests.python.test_project_base_adapter_freshness \
            -v

      - name: Check out Base validator reference
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          # Current validator only: it canonicalizes Git evidence bytes across Windows EOL.
          # Its unreleased v9.5 policy is not adopted by this project adapter.
          ref: 19355b7ef065a21d0f2b685c7d9be64a4a3970f8
          path: .base-validator
          fetch-depth: 0

      - name: Check out Base v9.4.4 released contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: 5adc196c0185951f50e49ab5e51586eff8d60886
          path: .base-release
          fetch-depth: 0

      - name: Install validator dependencies
        run: python -m pip install -r .base-validator/.github/validation-requirements.txt

      - name: Select the retained approved protected baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          APPROVAL_PATH="docs/approvals/PROJECT_PROTECTED_CHANGE_APPROVAL_GLOBAL_ROSTER_AND_STRATEGIC_MAP_2026-08-30.json"
          test -f "$APPROVAL_PATH"
          PROTECTED_BASE_SHA="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["protected_base_commit"])' "$APPROVAL_PATH")"
          python -c 'import re, sys; value = sys.argv[1]; raise SystemExit(0 if re.fullmatch(r"[0-9a-f]{40}", value) else 1)' "$PROTECTED_BASE_SHA"
          git cat-file -e "$PROTECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PROTECTED_BASE_SHA" "$PR_BASE_SHA"
          printf 'PROTECTED_BASE_SHA=%s\n' "$PROTECTED_BASE_SHA" >> "$GITHUB_ENV"
          printf 'APPROVAL_PATH=%s\n' "$APPROVAL_PATH" >> "$GITHUB_ENV"

      - name: Validate generated adapter contract
        run: |
          set -euo pipefail
          python .base-validator/tools/check_approved_project_operating_contract.py \
            --project-root . \
            --base-repository .base-release \
            --protected-base "$PROTECTED_BASE_SHA" \
            --approval "$APPROVAL_PATH" \
            --external-approval true \
            --check
