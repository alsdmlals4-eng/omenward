name: Validate Project Base Adapter

on:
  pull_request:
    paths:
      - "skills/PROJECT_BASE_ADAPTER.json"
      - "skills/BASE_V9_ADAPTER.json"
      - "skills/PROJECT_BASE_SKILL_ADAPTER.json"
      - "skills/PROJECT_SKILL_SNAPSHOT.json"
      - "docs/PROJECT_OPERATING_DASHBOARD.html"
      - "docs/PROJECT_OPERATING_HEALTH.json"
      - "docs/operations/PROJECT_BASE_ADAPTER_SHEET_SYNC_EVIDENCE_2026-08-08.json"
      - "docs/operations/ACTIVE_INTEGRATED_CONTRACT_STATE.v1.json"
      - "docs/PROJECT_CANON_DECISION_LEDGER.md"
      - "docs/process/ACTIVE_INTEGRATED_CONTRACT_BINDING_2026-08-06.md"
      - "tests/python/test_project_base_adapter_freshness.py"
      - "tests/python/test_active_integrated_contract_v4_4.py"
      - "tools/validate_active_integrated_contract_v4_4.py"
      - ".github/workflows/validate-project-base-adapter.yml"

permissions:
  contents: read

concurrency:
  group: project-base-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run project adapter freshness contract diagnostic
        continue-on-error: true
        run: python -m unittest tests.python.test_project_base_adapter_freshness -v

      - name: Check out Base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1
          path: .base-contract
          fetch-depth: 0

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Select trusted protected baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ADAPTER_PATH="skills/PROJECT_BASE_ADAPTER.json"
          PROTECTED_BASE_SHA="$PR_BASE_SHA"
          python -c 'import re, sys; value = sys.argv[1]; raise SystemExit(0 if re.fullmatch(r"[0-9a-f]{40}", value) else 1)' "$PROTECTED_BASE_SHA"
          git cat-file -e "$PROTECTED_BASE_SHA^{commit}"
          BASELINE_POLICY_SHA="$(
            git show "$PROTECTED_BASE_SHA:$ADAPTER_PATH" |
            python -c 'import hashlib,json,sys; data=json.load(sys.stdin); raw=(json.dumps(data["protected_paths"],ensure_ascii=False,indent=2,sort_keys=True)+"\n").encode(); print(hashlib.sha256(raw).hexdigest())'
          )"
          printf 'PROTECTED_BASE_SHA=%s\n' "$PROTECTED_BASE_SHA" >> "$GITHUB_ENV"
          printf 'BASELINE_POLICY_SHA=%s\n' "$BASELINE_POLICY_SHA" >> "$GITHUB_ENV"
          printf 'protected_policy_sha256=%s\n' "$BASELINE_POLICY_SHA"

      - name: Materialize target adapter in CI workspace
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import os

          path = Path("skills/PROJECT_BASE_ADAPTER.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["gdd_sheet"]["declared_sync_status"] = "SHEET_GITHUB_SYNCED"
          data["gdd_sheet"]["sync_status"] = "CURRENT"
          data["protected_baseline"] = {
              "authority_kind": "REMOTE_TRACKING_REF",
              "authority_ref": "refs/remotes/origin/main",
              "commit": os.environ["PROTECTED_BASE_SHA"],
              "policy_sha256": os.environ["BASELINE_POLICY_SHA"],
              "policy_source_path": "skills/PROJECT_BASE_ADAPTER.json",
              "policy_source_type": "CANONICAL_ADAPTER_SOURCE",
              "protected_paths_pointer": "/protected_paths",
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Generate operating artifacts from Base authority
        run: |
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --write

      - name: Validate generated target adapter
        run: |
          python .base-contract/tools/check_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --check

      - name: Upload generated adapter outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: project-base-adapter-generated-${{ github.event.pull_request.head.sha }}
          path: |
            skills/PROJECT_BASE_ADAPTER.json
            skills/PROJECT_SKILL_SNAPSHOT.json
            docs/PROJECT_OPERATING_DASHBOARD.html
            skills/BASE_V9_ADAPTER.json
            skills/PROJECT_BASE_SKILL_ADAPTER.json
          if-no-files-found: error

      - name: Enforce project adapter freshness contract
        run: python -m unittest tests.python.test_project_base_adapter_freshness -v
