name: Validate Project Base Adapter

on:
  pull_request:
    paths:
      - "skills/PROJECT_BASE_ADAPTER.json"
      - "skills/BASE_V9_ADAPTER.json"
      - "skills/PROJECT_BASE_SKILL_ADAPTER.json"
      - "skills/PROJECT_SKILL_SNAPSHOT.json"
      - "docs/PROJECT_OPERATING_DASHBOARD.html"
      - "docs/PROJECT_OPERATING_HEALTH.json"
      - "docs/operations/PROJECT_BASE_ADAPTER_SHEET_SYNC_EVIDENCE_2026-08-08.json"
      - "docs/operations/ACTIVE_INTEGRATED_CONTRACT_STATE.v1.json"
      - "docs/PROJECT_CANON_DECISION_LEDGER.md"
      - "docs/process/ACTIVE_INTEGRATED_CONTRACT_BINDING_2026-08-06.md"
      - "tests/python/test_project_base_adapter_freshness.py"
      - "tests/python/test_active_integrated_contract_v4_4.py"
      - "tests/python/test_r54_workspace_authority_reconciliation.py"
      - "tools/validate_active_integrated_contract_v4_4.py"
      - ".github/workflows/validate-project-base-adapter.yml"

permissions:
  contents: read

concurrency:
  group: project-base-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run project adapter freshness contract
        run: python -m unittest tests.python.test_project_base_adapter_freshness tests.python.test_r54_workspace_authority_reconciliation -v

      - name: Check out current Base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: edb3b3376603c9f6b00d64af3126304f8c9946bf
          path: .base-contract
          fetch-depth: 0

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Verify recorded protected baseline ancestry
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          RECORDED_PROTECTED_BASE_SHA="$(
            python -c 'import json; payload = json.load(open("skills/PROJECT_BASE_ADAPTER.json", encoding="utf-8")); print(payload["protected_baseline"]["commit"])'
          )"
          python -c 'import re, sys; value = sys.argv[1]; raise SystemExit(0 if re.fullmatch(r"[0-9a-f]{40}", value) else 1)' "$RECORDED_PROTECTED_BASE_SHA"
          git cat-file -e "$RECORDED_PROTECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$RECORDED_PROTECTED_BASE_SHA" "$PR_BASE_SHA"
          printf 'RECORDED_PROTECTED_BASE_SHA=%s\n' "$RECORDED_PROTECTED_BASE_SHA" >> "$GITHUB_ENV"

      - name: Check generated operating artifacts
        run: |
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --check

      - name: Validate adapter through recorded remote baseline authority
        run: |
          python .base-contract/tools/check_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --check
