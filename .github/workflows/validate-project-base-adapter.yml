name: Validate Project Base Adapter

on:
  pull_request:
    paths:
      - "skills/PROJECT_BASE_ADAPTER.json"
      - "skills/BASE_V9_ADAPTER.json"
      - "skills/PROJECT_BASE_SKILL_ADAPTER.json"
      - "docs/PROJECT_OPERATING_HEALTH.json"
      - "docs/operations/ACTIVE_INTEGRATED_CONTRACT_STATE.v1.json"
      - "docs/PROJECT_CANON_DECISION_LEDGER.md"
      - "docs/process/ACTIVE_INTEGRATED_CONTRACT_BINDING_2026-08-06.md"
      - "tests/python/test_project_base_adapter_freshness.py"
      - "tests/python/test_active_integrated_contract_v4_4.py"
      - "tools/validate_active_integrated_contract_v4_4.py"
      - ".github/workflows/validate-project-base-adapter.yml"

permissions:
  contents: read

concurrency:
  group: project-base-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run project adapter freshness contract
        run: python -m unittest tests.python.test_project_base_adapter_freshness -v

      - name: Check out Base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1
          path: .base-contract
          fetch-depth: 0

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Select trusted protected baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ADAPTER_PATH="skills/PROJECT_BASE_ADAPTER.json"
          ADAPTER_CHANGES="$(git diff --name-only "$PR_BASE_SHA"...HEAD -- "$ADAPTER_PATH")"
          if printf '%s\n' "$ADAPTER_CHANGES" | grep -Fxq "$ADAPTER_PATH"; then
            PROTECTED_BASE_SHA="$PR_BASE_SHA"
          else
            PROTECTED_BASE_SHA="$(
              git show "$PR_BASE_SHA:$ADAPTER_PATH" |
                python -c 'import json, sys; payload = json.load(sys.stdin); print(payload["protected_baseline"]["commit"])'
            )"
          fi
          python -c 'import re, sys; value = sys.argv[1]; raise SystemExit(0 if re.fullmatch(r"[0-9a-f]{40}", value) else 1)' "$PROTECTED_BASE_SHA"
          git cat-file -e "$PROTECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PROTECTED_BASE_SHA" "$PR_BASE_SHA"
          BASELINE_POLICY_SHA="$(git show "$PROTECTED_BASE_SHA:$ADAPTER_PATH" | sha256sum | awk '{print $1}')"
          printf 'PROTECTED_BASE_SHA=%s\n' "$PROTECTED_BASE_SHA" >> "$GITHUB_ENV"
          printf 'baseline_adapter_sha256=%s\n' "$BASELINE_POLICY_SHA"

      - name: Check generated operating artifacts
        run: |
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --check

      - name: Validate adapter against trusted protected baseline
        run: |
          python .base-contract/tools/check_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --check
