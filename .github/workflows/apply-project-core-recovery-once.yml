name: Apply Project Core Recovery Once

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/_apply_project_core_recovery.py"
      - ".github/workflows/apply-project-core-recovery-once.yml"

permissions:
  contents: write

concurrency:
  group: omenward-project-core-recovery-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/project-core-canon-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply, validate, commit, and push core canon recovery
        if: ${{ hashFiles('tools/_apply_project_core_recovery.py') != '' }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/_apply_project_core_recovery.py")
          text = path.read_text(encoding="utf-8")
          marker = '''replace_once(
              "docs/OMENWARD_ROADMAP.md",
              "## 4. G1 — Phase 0 Work Order",'''
          start = text.index(marker)
          end_marker = ')\nreplace_regex("docs/OMENWARD_ROADMAP.md", r"## 15\\. 지금 실행할 단 하나의 작업'
          end = text.index(end_marker, start) + 2
          path.write_text(text[:start] + text[end:], encoding="utf-8", newline="\n")
          PY
          set +e
          python tools/_apply_project_core_recovery.py > project-core-recovery.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            mkdir -p docs
            tail -n 160 project-core-recovery.log > docs/_CORE_RECOVERY_FAILURE.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/_CORE_RECOVERY_FAILURE.log
            git commit -m "record project core recovery failure" || true
            git push origin HEAD:agent/project-core-canon-recovery
          fi
          exit $status
