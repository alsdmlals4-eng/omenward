name: Finalize C2 Remote Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/_finalize_c2_remote_proof.py"
      - ".github/workflows/finalize-c2-remote-proof.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/c2-battle-objective-loop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c2-battle-objective-loop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Finalize C2 proof and durable contracts
        run: python tools/_finalize_c2_remote_proof.py
      - name: Compile and validate all contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/validate_c1_roulette.py tools/validate_c2_battle_objective.py tools/validate_project_core_docs.py tests/python/test_c1_roulette_contract.py tests/python/test_c2_battle_objective_contract.py
          python tools/validate_c1_roulette.py
          python tools/validate_c2_battle_objective.py
          python tools/validate_project_core_docs.py
          if [ -f tools/validate_skill_system.py ]; then python tools/validate_skill_system.py; fi
          python -m unittest discover -s tests/python -v
      - name: Install Godot 4.7.1 Standard
        shell: bash
        run: |
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import and run full Godot regression
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --editor --quit
          for test_file in tests/headless/*_test.gd; do
            /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . -s "res://${test_file}"
          done
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --quit-after 1
      - name: Verify clean generated tree and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e tools/_finalize_c2_remote_proof.py
          test ! -e .github/workflows/finalize-c2-remote-proof.yml
          test ! -e .github/workflows/validate-c1-roulette.yml
          test -e .github/workflows/validate-core-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "finalize C2 remote-proven contracts"
          git push origin HEAD:agent/c2-battle-objective-loop
