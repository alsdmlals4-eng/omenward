name: Manual Contract Execution

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/_apply_c1_roulette_contract.py"
      - ".github/workflows/manual-contract-execution.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/c1-approved-roulette-contract-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c1-approved-roulette-contract-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Execute current guarded contract application
        shell: bash
        run: |
          set +e
          python tools/_apply_c1_roulette_contract.py > /tmp/contract-execution.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 360 /tmp/contract-execution.log > /tmp/execution-failure.log
            git fetch origin agent/c1-approved-roulette-contract-recovery
            git reset --hard origin/agent/c1-approved-roulette-contract-recovery
            cp /tmp/execution-failure.log docs/_EXECUTION_FAILURE.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/_EXECUTION_FAILURE.log
            git commit -m "record current contract execution failure"
            git push origin HEAD:agent/c1-approved-roulette-contract-recovery
          fi
          exit $status
