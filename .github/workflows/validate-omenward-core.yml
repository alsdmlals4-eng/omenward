name: Validate Omenward Core

on:
  pull_request:
    branches:
      - main
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "data/**"
      - "resources/**"
      - "tests/headless/**"
      - "tests/python/**"
      - "!tests/python/test_project_core_docs.py"
      - "!tests/python/test_ci_usage_contract.py"
      - "!tests/python/test_skill_*.py"
      - "!tests/python/test_adversarial_review_contract.py"
      - "tools/validate_c1_roulette.py"
      - "tools/validate_c2_battle_objective.py"
      - "tools/validate_c3_core_ux.py"
      - ".github/workflows/validate-omenward-core.yml"
  push:
    branches:
      - main
    paths:
      - "project.godot"
      - "scripts/**"
      - "scenes/**"
      - "data/**"
      - "resources/**"
      - "tests/headless/**"
      - "tests/python/**"
      - "!tests/python/test_project_core_docs.py"
      - "!tests/python/test_ci_usage_contract.py"
      - "!tests/python/test_skill_*.py"
      - "!tests/python/test_adversarial_review_contract.py"
      - "tools/validate_c1_roulette.py"
      - "tools/validate_c2_battle_objective.py"
      - "tools/validate_c3_core_ux.py"
      - ".github/workflows/validate-omenward-core.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts_pr:
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run captured core validation suite
        shell: bash
        run: |
          set +e
          status=0
          log="core-contract-validation.log"
          status_file="core-contract-validation.status"
          : > "$log"

          run_check() {
            name="$1"
            shift
            {
              echo "===== ${name} ====="
              printf 'COMMAND:'
              printf ' %q' "$@"
              echo
            } | tee -a "$log"
            "$@" 2>&1 | tee -a "$log"
            code=${PIPESTATUS[0]}
            echo "EXIT_CODE: ${code}" | tee -a "$log"
            echo | tee -a "$log"
            if [ "$code" -ne 0 ]; then
              status="$code"
            fi
          }

          run_check "compile Python contracts" python -m py_compile tools/validate_c1_roulette.py tools/validate_c2_battle_objective.py tools/validate_c3_core_ux.py tools/validate_ci_usage_contract.py tests/python/test_c1_roulette_contract.py tests/python/test_c2_battle_objective_contract.py tests/python/test_c3_core_ux_contract.py tests/python/test_ci_usage_contract.py
          run_check "validate C1 roulette contract" python tools/validate_c1_roulette.py
          run_check "validate C2 battle objective contract" python tools/validate_c2_battle_objective.py
          run_check "validate C3 core UX contract" python tools/validate_c3_core_ux.py
          run_check "validate CI usage contract" python tools/validate_ci_usage_contract.py
          run_check "fast core and CI contract tests" python -m unittest tests.python.test_c1_roulette_contract tests.python.test_c2_battle_objective_contract tests.python.test_c3_core_ux_contract tests.python.test_ci_usage_contract -v
          run_check "whitespace" git diff --check

          printf '%s\n' "$status" > "$status_file"
          exit 0
      - name: Upload core validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-contract-validation-${{ github.sha }}
          path: |
            core-contract-validation.log
            core-contract-validation.status
          if-no-files-found: error
          retention-days: 1
      - name: Enforce core validation result
        if: always()
        shell: bash
        run: |
          test -f core-contract-validation.status
          status="$(cat core-contract-validation.status)"
          if [ "$status" -ne 0 ]; then
            echo "Core validation failed with exit code ${status}. See diagnostic artifact."
            exit "$status"
          fi

  contracts_full:
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python contracts
        run: python -m py_compile tools/validate_c1_roulette.py tools/validate_c2_battle_objective.py tools/validate_c3_core_ux.py tools/validate_ci_usage_contract.py tests/python/test_c1_roulette_contract.py tests/python/test_c2_battle_objective_contract.py tests/python/test_c3_core_ux_contract.py tests/python/test_ci_usage_contract.py
      - name: Validate C1 roulette contract
        run: python tools/validate_c1_roulette.py
      - name: Validate C2 battle objective contract
        run: python tools/validate_c2_battle_objective.py
      - name: Validate C3 core UX contract
        run: python tools/validate_c3_core_ux.py
      - name: Validate CI usage contract
        run: python tools/validate_ci_usage_contract.py
      - name: Run Python repository tests
        run: python -m unittest discover -s tests/python -v
      - name: Check whitespace
        run: git diff --check

  godot:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject temporary C3 artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e docs/_C3_HEADLESS_DIAGNOSTIC.log
          test ! -e tools/_repair_c3_stage_run_types.py
          test ! -e tools/sync_c3_canonical_docs.py
          test ! -e tools/finalize_c3_proof.py
          test ! -e .github/workflows/diagnose-c3-headless.yml
          test ! -e .github/workflows/sync-c3-canonical-docs.yml
          test ! -e .github/workflows/core-contracts.yml
          test ! -e .github/workflows/validate-core-contracts.yml
          test ! -e .github/workflows/finalize-c3-proof.yml
      - name: Install Godot 4.7.1 Standard
        shell: bash
        run: |
          curl -fL "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --version
      - name: Import project
        shell: bash
        run: timeout 120s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Run all headless contract tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/headless/*_test.gd; do
            echo "Running ${test_file}"
            timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . -s "res://${test_file}"
          done
      - name: Runtime smoke
        shell: bash
        run: timeout 60s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path . --quit-after 1
