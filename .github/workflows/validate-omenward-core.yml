name: Validate Omenward Core

on:
  pull_request:
    branches:
      - main
    paths:
      - "project.godot"
      - "addons/**"
      - "scripts/**"
      - "scenes/**"
      - "data/**"
      - "resources/**"
      - "tests/headless/**"
      - "tests/python/**"
      - "!tests/python/test_project_core_docs.py"
      - "!tests/python/test_skill_*.py"
      - "!tests/python/test_adversarial_review_contract.py"
      - "tools/validate_c1_roulette.py"
      - "tools/validate_c2_battle_objective.py"
      - "tools/validate_c3_core_ux.py"
      - "tools/validate_ci_usage_contract.py"
      - ".github/workflows/validate-omenward-core.yml"
  push:
    branches:
      - main
    paths:
      - "project.godot"
      - "addons/**"
      - "scripts/**"
      - "scenes/**"
      - "data/**"
      - "resources/**"
      - "tests/headless/**"
      - "tests/python/**"
      - "!tests/python/test_project_core_docs.py"
      - "!tests/python/test_skill_*.py"
      - "!tests/python/test_adversarial_review_contract.py"
      - "tools/validate_c1_roulette.py"
      - "tools/validate_c2_battle_objective.py"
      - "tools/validate_c3_core_ux.py"
      - "tools/validate_ci_usage_contract.py"
      - ".github/workflows/validate-omenward-core.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts_pr:
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact Base recovery source
        uses: actions/checkout@v4
        with:
          repository: alsdmlals4-eng/Base
          ref: fa69a77a14f923a756064f6ae151d34cadb374f7
          path: _base_recovery
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install full-suite Python dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Python contracts
        run: python -m py_compile tools/validate_c1_roulette.py tools/validate_c2_battle_objective.py tools/validate_c3_core_ux.py tools/validate_ci_usage_contract.py tests/python/test_current_canon_reconciliation_20260821.py tests/python/test_c1_roulette_contract.py tests/python/test_c2_battle_objective_contract.py tests/python/test_c3_core_ux_contract.py tests/python/test_ci_usage_contract.py tests/python/test_base_recovery_map.py
      - name: Validate current canon reconciliation
        run: python -m unittest tests.python.test_current_canon_reconciliation_20260821 -v
      - name: Validate C1 roulette contract
        run: python tools/validate_c1_roulette.py
      - name: Validate C2 battle objective contract
        run: python tools/validate_c2_battle_objective.py
      - name: Validate C3 core UX contract
        run: python tools/validate_c3_core_ux.py
      - name: Validate CI usage contract
        run: python tools/validate_ci_usage_contract.py
      - name: Run fast core and CI contract tests
        run: python -m unittest tests.python.test_current_canon_reconciliation_20260821 tests.python.test_c1_roulette_contract tests.python.test_c2_battle_objective_contract tests.python.test_c3_core_ux_contract tests.python.test_ci_usage_contract tests.python.test_base_recovery_map -v
      - name: Run full Python repository tests before merge
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests/python -v 2>&1 | tee /tmp/omenward-unittest.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            grep -E '^(FAIL|ERROR): ' /tmp/omenward-unittest.log | while IFS= read -r line; do
              echo "::error title=Python repository test failure::${line}"
            done
            exit "${status}"
          fi
      - name: Check whitespace
        run: git diff --check

  contracts_full:
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Historical C2 proof baseline retained after extending coverage to Python 3.11.
        # python-version: ["3.12", "3.13"]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact Base recovery source
        uses: actions/checkout@v4
        with:
          repository: alsdmlals4-eng/Base
          ref: fa69a77a14f923a756064f6ae151d34cadb374f7
          path: _base_recovery
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install full-suite Python dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile Python contracts
        run: python -m py_compile tools/validate_c1_roulette.py tools/validate_c2_battle_objective.py tools/validate_c3_core_ux.py tools/validate_ci_usage_contract.py tests/python/test_current_canon_reconciliation_20260821.py tests/python/test_c1_roulette_contract.py tests/python/test_c2_battle_objective_contract.py tests/python/test_c3_core_ux_contract.py tests/python/test_ci_usage_contract.py tests/python/test_base_recovery_map.py
      - name: Validate current canon reconciliation
        run: python -m unittest tests.python.test_current_canon_reconciliation_20260821 -v
      - name: Validate C1 roulette contract
        run: python tools/validate_c1_roulette.py
      - name: Validate C2 battle objective contract
        run: python tools/validate_c2_battle_objective.py
      - name: Validate C3 core UX contract
        run: python tools/validate_c3_core_ux.py
      - name: Validate CI usage contract
        run: python tools/validate_ci_usage_contract.py
      - name: Run full Python repository tests
        run: python -m unittest discover -s tests/python -v
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

  godot:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject temporary C3 artifacts
        shell: bash
        run: |
          test ! -e tools/finalize_c3_proof.py
          test ! -e .github/workflows/core-contracts.yml
          test ! -e .github/workflows/validate-core-contracts.yml
          test ! -e .github/workflows/finalize-c3-proof.yml
      - name: Install Godot 4.7.1 Standard
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, zipfile
          url='https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip'
          urllib.request.urlretrieve(url, '/tmp/godot.zip')
          with zipfile.ZipFile('/tmp/godot.zip') as z:
              z.extractall('/tmp/godot')
          PY
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
      - name: Import project
        run: timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --import
      - name: Run all headless contract tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/headless/*_test.gd; do
            timeout 60s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . -s "res://${test_file}"
          done
      - name: Runtime smoke
        run: timeout 10s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . || test $? -eq 124
