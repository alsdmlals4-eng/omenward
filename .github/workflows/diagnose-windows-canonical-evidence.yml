name: Diagnose Windows Canonical Evidence Portability

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-windows-canonical-evidence.yml"
      - "tests/python/**"
      - "tools/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-python:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Check out exact Base recovery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: alsdmlals4-eng/Base
          ref: fa69a77a14f923a756064f6ae151d34cadb374f7
          path: _base_recovery
          fetch-depth: 1
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install full-suite Python dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run full repository Python suite
        run: python -m unittest discover -s tests/python -v
      - name: Check whitespace
        run: git diff --check
