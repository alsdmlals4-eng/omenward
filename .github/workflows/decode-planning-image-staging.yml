name: Decode planning image staging

on:
  push:
    branches: [main]
    paths:
      - "docs/images/.staging/READY"

permissions:
  contents: write

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode canonical visual reference
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/images/.staging/READY
          mkdir -p docs/images/planning/canonical
          cat docs/images/.staging/ui/part_* | base64 --decode > docs/images/planning/canonical/omenward_battlefield_ui_and_unit_style_reference_v1.webp
          file docs/images/planning/canonical/omenward_battlefield_ui_and_unit_style_reference_v1.webp | grep -q 'Web/P image'
          identify docs/images/planning/canonical/omenward_battlefield_ui_and_unit_style_reference_v1.webp | grep -q '800x450'
          rm -rf docs/images/.staging

      - name: Commit decoded planning reference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git commit -m "docs(images): add canonical battlefield and unit style reference"
          git push
