name: Apply OMENWARD GDD Sheet Sync Once
on:
  pull_request:
    branches: [main]
    paths: ["tools/apply_omenward_gdd_sheet_sync_once.py", ".github/workflows/apply-project-gdd-sheet-sync-once.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/apply_omenward_gdd_sheet_sync_once.py
      - run: |
          python tests/python/test_bca_visual_sheet_adoption.py
          python tools/validate_c1_roulette.py
          python -m json.tool docs/base/SKILL_REGISTRY.json >/dev/null
          git diff --check
      - run: |
          rm -f .github/workflows/validate-bca-visual-sheet-adoption.yml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md docs/BASE_RULES_VERSION.md docs/BCA_VISUAL_SHEET_ADOPTION_AUDIT.md docs/GPT_IMAGE_GENERATION_AND_REVIEW_WORKFLOW.md docs/PROJECT_GOOGLE_SHEET_WORKBOOK.md docs/CURRENT_IMPLEMENTATION_STATUS.md docs/OMENWARD_ROADMAP.md docs/design/APPROVED_ROULETTE_CORE_RULES.md docs/base/SKILL_REGISTRY.json skills/disciplines/governing-omenward-art-animation-and-assets/SKILL.md tools/validate_c1_roulette.py tests/python/test_bca_visual_sheet_adoption.py
          git commit -m "docs: configure OMENWARD GDD Sheet and C1 evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
