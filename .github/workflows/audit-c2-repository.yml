name: Audit C2 Repository
# Current-head audit trigger.

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/_audit_c2_repository.py"
      - ".github/workflows/audit-c2-repository.yml"

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'agent/c2-battle-objective-loop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c2-battle-objective-loop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Collect C2 repository evidence
        run: python tools/_audit_c2_repository.py
      - name: Commit audit input
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_C2_AUDIT_INPUT.md
          git commit -m "collect C2 repository audit input" || true
          git push origin HEAD:agent/c2-battle-objective-loop
