name: Validate Omenward Base Sync and Publications

on:
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "docs/base/**"
      - '[기획서]/**'
      - "skills/**"
      - "schemas/**"
      - "tests/python/**"
      - "tools/build_design_documents.py"
      - "tools/build_project_skill_map.py"
      - "tools/check_active_markdown_links.py"
      - "tools/design_document_diagrams.py"
      - "tools/publication_v3.py"
      - "tools/skill_map_diagrams.py"
      - "requirements-publication.txt"
      - ".github/workflows/validate-document-publications.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-linux:
    name: base-sync-publications-linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-nanum poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements-publication.txt

      - name: Run Python contract tests
        run: python -m unittest discover -s tests/python -v

      - name: Check active Markdown links
        run: python tools/check_active_markdown_links.py

      - name: Regenerate design-document publications from this commit
        run: |
          python tools/build_design_documents.py \
            --registry "[기획서]/00_프로젝트_허브/DESIGN_DOCUMENT_REGISTRY.json" \
            --source-commit "$GITHUB_SHA"

      - name: Regenerate Skill Map from this commit
        run: |
          python tools/build_project_skill_map.py \
            --registry "[기획서]/00_프로젝트_허브/SKILL_REGISTRY.json" \
            --output-dir "[기획서]/00_프로젝트_허브" \
            --project-name Omenward \
            --source-commit "$GITHUB_SHA"

      - name: Upload generated publication snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omenward-skill-map-linux
          path: |
            [기획서]/00_프로젝트_허브/PROJECT_SKILL_MAP.md
            [기획서]/00_프로젝트_허브/PROJECT_SKILL_MAP.pdf
            [기획서]/00_프로젝트_허브/PROJECT_SKILL_MAP.assets/**
            [기획서]/00_프로젝트_허브/SKILL_MAP_PUBLICATION_MANIFEST.json
          if-no-files-found: error
          retention-days: 7

      - name: Require clean generated publications
        run: |
          git diff --check
          git diff --exit-code

  validate-windows:
    name: base-sync-publications-windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install publication dependencies
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress
          python -m pip install --upgrade pip
          python -m pip install -r requirements-publication.txt

      - name: Run Python contract tests
        shell: pwsh
        run: python -m unittest discover -s tests/python -v

      - name: Check active Markdown links
        shell: pwsh
        run: python tools/check_active_markdown_links.py

      - name: Regenerate design-document publications from this commit
        shell: pwsh
        run: |
          $env:BASE_LIBREOFFICE = 'C:\Program Files\LibreOffice\program\soffice.exe'
          python tools/build_design_documents.py `
            --registry "[기획서]/00_프로젝트_허브/DESIGN_DOCUMENT_REGISTRY.json" `
            --source-commit "$env:GITHUB_SHA"

      - name: Regenerate Skill Map from this commit
        shell: pwsh
        run: |
          $env:BASE_LIBREOFFICE = 'C:\Program Files\LibreOffice\program\soffice.exe'
          python tools/build_project_skill_map.py `
            --registry "[기획서]/00_프로젝트_허브/SKILL_REGISTRY.json" `
            --output-dir "[기획서]/00_프로젝트_허브" `
            --project-name Omenward `
            --source-commit "$env:GITHUB_SHA"

      - name: Upload generated publication snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omenward-skill-map-windows
          path: |
            [기획서]/00_프로젝트_허브/PROJECT_SKILL_MAP.md
            [기획서]/00_프로젝트_허브/PROJECT_SKILL_MAP.pdf
            [기획서]/00_프로젝트_허브/PROJECT_SKILL_MAP.assets/**
            [기획서]/00_프로젝트_허브/SKILL_MAP_PUBLICATION_MANIFEST.json
          if-no-files-found: error
          retention-days: 7

      - name: Require clean generated publications
        shell: pwsh
        run: |
          git diff --check
          git diff --exit-code
