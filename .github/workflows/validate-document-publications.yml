name: Apply staged Omenward Base sync

on:
  pull_request:
    paths:
      - ".base-sync/**"
      - "tools/apply_base_sync_payload.py"
      - ".github/workflows/validate-document-publications.yml"

permissions:
  contents: write

jobs:
  apply-base-sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply verified payload
        run: python tools/apply_base_sync_payload.py

      - name: Run source contract tests
        run: python -m unittest discover -s tests/python -v

      - name: Check active Markdown links
        run: python tools/check_active_markdown_links.py

      - name: Commit the atomic source synchronization
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "sync Omenward with current Base operating model"
          git push origin "HEAD:${HEAD_BRANCH}"
