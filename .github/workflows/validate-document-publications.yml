name: Validate Omenward Document Publications

on:
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - '\[기획서\]/**'
      - "skills/**"
      - "schemas/**"
      - "tools/build_design_documents.py"
      - "tools/build_project_skill_map.py"
      - "tools/design_document_diagrams.py"
      - "tools/publication_v3.py"
      - "tools/skill_map_diagrams.py"
      - "requirements-publication.txt"
      - ".github/workflows/validate-document-publications.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-linux:
    name: document-publications-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-nanum poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements-publication.txt
      - name: Regenerate PDFs and manifests
        run: |
          python tools/build_design_documents.py --registry "[기획서]/00_프로젝트_허브/DESIGN_DOCUMENT_REGISTRY.json"
          python tools/build_project_skill_map.py --registry "[기획서]/00_프로젝트_허브/SKILL_REGISTRY.json" --output-dir "[기획서]/00_프로젝트_허브" --project-name Omenward
          git diff --check
          git diff --exit-code -- "[기획서]"
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omenward-publication-manifests-linux
          path: "**/*PUBLICATION_MANIFEST.json"
          if-no-files-found: error
          retention-days: 7

  publish-windows:
    name: document-publications-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install publication dependencies
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress
          python -m pip install --upgrade pip
          python -m pip install -r requirements-publication.txt
      - name: Regenerate PDFs and manifests
        shell: pwsh
        run: |
          $env:BASE_LIBREOFFICE = 'C:\Program Files\LibreOffice\program\soffice.exe'
          python tools/build_design_documents.py --registry "[기획서]/00_프로젝트_허브/DESIGN_DOCUMENT_REGISTRY.json"
          python tools/build_project_skill_map.py --registry "[기획서]/00_프로젝트_허브/SKILL_REGISTRY.json" --output-dir "[기획서]/00_프로젝트_허브" --project-name Omenward
          git diff --check
          git diff --exit-code -- "[기획서]"
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omenward-publication-manifests-windows
          path: "**/*PUBLICATION_MANIFEST.json"
          if-no-files-found: error
          retention-days: 7
