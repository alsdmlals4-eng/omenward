name: Validate Tool State User Approval Remote Sync

on:
  pull_request:
    paths:
      - ".github/workflows/validate-tool-state-user-approval-remote-sync.yml"
      - "docs/process/APPROVED_OMENWARD_GODOT_AI_3_1_3_HERA_GUT_USER_APPROVAL_AND_REMOTE_SYNC_RECONCILIATION_2026-08-09.md"
      - "docs/operations/ACTIVE_INTEGRATED_CONTRACT_STATE.v1.json"
      - "docs/DECISIONS_PENDING.md"
      - "docs/PROJECT_CANON_DECISION_LEDGER.md"
      - "docs/process/ACTIVE_INTEGRATED_CONTRACT_BINDING_2026-08-06.md"
      - "tests/python/test_tool_state_user_approval_remote_sync.py"
      - "tests/python/test_active_integrated_contract_v4_4.py"
      - "tools/validate_active_integrated_contract_v4_4.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool-state-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile focused tool-state contract
        run: python -m py_compile tests/python/test_tool_state_user_approval_remote_sync.py
      - name: Run focused tool-state contract
        run: python -m unittest tests.python.test_tool_state_user_approval_remote_sync
