name: Apply C1 Roulette Contract Once
# Guarded rerun after stale-reference cleanup.

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/_apply_c1_roulette_contract.py"
      - ".github/workflows/apply-c1-roulette-contract-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/c1-approved-roulette-contract-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply C1 contract and run static validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/_apply_c1_roulette_contract.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '+ "\\n# return cards\\n", encoding="utf-8")',
              '+ "\\\\n# return cards\\\\n", encoding="utf-8")',
          )
          text = text.replace(
              '+ "\\n`docs/work_orders/0001-phase-0-codex-plan-mode.md`\\n", encoding="utf-8")',
              '+ "\\\\n`docs/work_orders/0001-phase-0-codex-plan-mode.md`\\\\n", encoding="utf-8")',
          )
          cleanup_marker = '    "docs/_C1_SHORTLIST_FAILURE.log",\n'
          if cleanup_marker not in text:
              raise RuntimeError("C1 cleanup marker missing")
          text = text.replace(cleanup_marker, cleanup_marker + '    "docs/_C1_APPLY_FAILURE.log",\n', 1)
          insertion_marker = "# Documentation map: remove task-specific legacy files from active routing."
          insertion = '''replace_once(
              "docs/OMENWARD_ROADMAP.md",
              "- 현재 조사 입력: `docs/work_orders/0002-current-main-audit-and-next-iteration-plan-mode.md`",
              "- 현재 구현·감사 입력: `docs/C1_ROULETTE_RECOVERY_REPORT_2026-07-22.md`",
          )
          replace_once(
              "docs/OMENWARD_ROADMAP.md",
              "- 사전 기술 추천안: `docs/design/proposals/0001-phase-0-godot-bootstrap.md`",
              "- 기술 기준선: 실제 `project.godot`, 코드·데이터·테스트와 `docs/CURRENT_IMPLEMENTATION_STATUS.md`",
          )
          old_plan = ROOT / "docs/superpowers/plans/2026-07-16-vertical-slice-stage-progression.md"
          if old_plan.exists():
              old_plan.unlink()

'''
          if insertion_marker not in text:
              raise RuntimeError("C1 documentation insertion marker missing")
          text = text.replace(insertion_marker, insertion + insertion_marker, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          set +e
          python tools/_apply_c1_roulette_contract.py > c1-apply.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 240 c1-apply.log > docs/_C1_APPLY_FAILURE.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/_C1_APPLY_FAILURE.log
            git commit -m "record C1 roulette apply failure" || true
            git push origin HEAD:agent/c1-approved-roulette-contract-recovery
          fi
          exit $status
