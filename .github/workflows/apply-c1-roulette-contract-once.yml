name: Apply C1 Roulette Contract Once

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/_apply_c1_roulette_contract.py"
      - ".github/workflows/apply-c1-roulette-contract-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/c1-approved-roulette-contract-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply C1 contract and run static validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/_apply_c1_roulette_contract.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '+ "\\n# return cards\\n", encoding="utf-8")',
              '+ "\\\\n# return cards\\\\n", encoding="utf-8")',
          )
          text = text.replace(
              '+ "\\n`docs/work_orders/0001-phase-0-codex-plan-mode.md`\\n", encoding="utf-8")',
              '+ "\\\\n`docs/work_orders/0001-phase-0-codex-plan-mode.md`\\\\n", encoding="utf-8")',
          )
          marker = '    "docs/_C1_SHORTLIST_FAILURE.log",\n'
          if marker not in text:
              raise RuntimeError("C1 cleanup marker missing")
          text = text.replace(marker, marker + '    "docs/_C1_APPLY_FAILURE.log",\n', 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          set +e
          python tools/_apply_c1_roulette_contract.py > c1-apply.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 240 c1-apply.log > docs/_C1_APPLY_FAILURE.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/_C1_APPLY_FAILURE.log
            git commit -m "record C1 roulette apply failure" || true
            git push origin HEAD:agent/c1-approved-roulette-contract-recovery
          fi
          exit $status
