name: Mark Validation Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/_mark_validation_evidence.py"
      - ".github/workflows/mark-validation-evidence.yml"

permissions:
  contents: write

jobs:
  mark:
    if: github.head_ref == 'agent/c1-approved-roulette-contract-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c1-approved-roulette-contract-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Synchronize proven C1 evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/_mark_validation_evidence.py")
          text = path.read_text(encoding="utf-8")
          marker = "# Self-clean before validation."
          insertion = '''replace_once(
              "tests/python/test_c1_roulette_contract.py",
              '            "docs/OMENWARD_GAME_DESIGN.md",\n            "docs/design/APPROVED_PREPRODUCTION_POC_BASELINE_V1.md",',
              '            "docs/OMENWARD_GAME_DESIGN.md",\n            "docs/CURRENT_IMPLEMENTATION_STATUS.md",\n            "docs/OMENWARD_ROADMAP.md",\n            "docs/design/APPROVED_ROULETTE_CORE_RULES.md",\n            "docs/design/APPROVED_PREPRODUCTION_POC_BASELINE_V1.md",',
          )
          replace_once(
              "tools/validate_project_core_docs.py",
              '    if "기술·데이터 그레이박스" not in readme or "코어 루프 미완결" not in readme:\n        errors.append("README does not expose the partial vertical-slice boundary")',
              '    if "C1 룰렛 핵심 계약 원격 검증 완료" not in readme or "전투 목적 루프·사람 플레이 미완결" not in readme:\n        errors.append("README does not expose the proven C1 and partial core-loop boundary")',
          )
          replace_once(
              "tools/validate_project_core_docs.py",
              '    if "승인 룰렛 계약 복구" not in decisions:\n        errors.append("DECISIONS_PENDING does not point to the next decision gate")',
              '    if "C1U 이동권·럭키" not in decisions:\n        errors.append("DECISIONS_PENDING does not point to the C1U decision gate")',
          )

'''
          if marker not in text:
              raise RuntimeError("evidence synchronizer insertion marker missing")
          text = text.replace(marker, insertion + marker, 1)
          text = text.replace(
              'script = ROOT / "tools/_mark_validation_evidence.py"\nif script.exists():\n    script.unlink()',
              'for relative in ("tools/_mark_validation_evidence.py", "docs/_EVIDENCE_SYNC_FAILURE.log"):\n    path = ROOT / relative\n    if path.exists():\n        path.unlink()',
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          set +e
          python tools/_mark_validation_evidence.py > /tmp/evidence-sync.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 360 /tmp/evidence-sync.log > /tmp/evidence-failure.log
            git fetch origin agent/c1-approved-roulette-contract-recovery
            git reset --hard origin/agent/c1-approved-roulette-contract-recovery
            cp /tmp/evidence-failure.log docs/_EVIDENCE_SYNC_FAILURE.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/_EVIDENCE_SYNC_FAILURE.log
            git commit -m "record C1 evidence sync failure"
            git push origin HEAD:agent/c1-approved-roulette-contract-recovery
          fi
          exit $status
