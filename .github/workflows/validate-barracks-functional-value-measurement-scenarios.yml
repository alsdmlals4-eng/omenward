name: Validate Barracks Functional Value Measurement Scenarios

on:
  pull_request:
    paths:
      - ".github/workflows/validate-barracks-functional-value-measurement-scenarios.yml"
      - "docs/design/APPROVED_OMENWARD_BARRACKS_FUNCTIONAL_VALUE_MEASUREMENT_SCENARIOS_2026-08-09.md"
      - "docs/design/APPROVED_OMENWARD_BARRACKS_FUNCTIONAL_VALUE_COMBAT_NUMERICS_DEFINITION_REVIEW_2026-08-09.md"
      - "docs/superpowers/specs/2026-08-09-barracks-functional-value-measurement-scenarios-design.md"
      - "docs/superpowers/plans/2026-08-09-barracks-functional-value-measurement-scenarios.md"
      - "docs/operations/ACTIVE_INTEGRATED_CONTRACT_STATE.v1.json"
      - "docs/DECISIONS_PENDING.md"
      - "docs/PROJECT_CANON_DECISION_LEDGER.md"
      - "docs/process/ACTIVE_INTEGRATED_CONTRACT_BINDING_2026-08-06.md"
      - "tests/python/test_barracks_functional_value_measurement_scenarios.py"
      - "tests/python/test_active_integrated_contract_v4_4.py"
      - "tools/validate_active_integrated_contract_v4_4.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measurement-scenario-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile focused measurement-scenario contract
        run: python -m py_compile tests/python/test_barracks_functional_value_measurement_scenarios.py
      - name: Run focused measurement-scenario contract
        run: python -m unittest tests.python.test_barracks_functional_value_measurement_scenarios
