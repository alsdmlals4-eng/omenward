name: Confirm Project Core Once

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/_confirm_project_core_once.py"
      - ".github/workflows/confirm-project-core-once.yml"

permissions:
  contents: write

jobs:
  confirm:
    if: github.head_ref == 'agent/project-core-canon-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Confirm and lock project core
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/_confirm_project_core_once.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "최초 `EXISTING_CORE_IDENTIFIED`로 기록했고, 2026-07-22 사용자의 `코어확정` 지시 뒤",
              "최초 식별 상태로 기록했고, 2026-07-22 사용자의 `코어확정` 지시 뒤",
          )
          text = text.replace(
              '        "정본·프로젝트 코어 복구",',
              '        "정본·프로젝트 코어 확정·잠금 완료",',
          )
          text = text.replace(
              '    ".github/workflows/confirm-project-core-once.yml",\n):',
              '    ".github/workflows/confirm-project-core-once.yml",\n    "docs/_CORE_CONFIRM_FAILURE.log",\n):',
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          set +e
          python tools/_confirm_project_core_once.py > project-core-confirm.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 180 project-core-confirm.log > docs/_CORE_CONFIRM_FAILURE.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/_CORE_CONFIRM_FAILURE.log
            git commit -m "record project core confirmation failure" || true
            git push origin HEAD:agent/project-core-canon-recovery
          fi
          exit $status
