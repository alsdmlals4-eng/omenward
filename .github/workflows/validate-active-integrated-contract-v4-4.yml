      - ".github/workflows/validate-barracks-10000-robustness-execution.yml"
      - ".github/workflows/validate-barracks-functional-value-combat-numerics-review.yml"
      - ".github/workflows/validate-barracks-functional-value-measurement-scenarios.yml"
      - ".gitignore"
      - ".gitattributes"
      - "AGENTS.md"
      - "docs/PROJECT_HOME.md"
      - "docs/ACTIVE_CONTEXT.md"
      - "docs/CURRENT_IMPLEMENTATION_STATUS.md"
      - "docs/DOCUMENTATION_MAP.md"
      - "docs/DOCUMENT_LIFECYCLE_REGISTRY.md"
      - "docs/OMENWARD_GDD_CURRENT_CANON.md"
      - "docs/PROJECT_CANON_DECISION_LEDGER.md"
      - "docs/PROJECT_CORE.md"
      - "docs/PROJECT_GOOGLE_SHEET_WORKBOOK.md"
      - "docs/DECISIONS_PENDING.md"
      - "docs/PROJECT_OPERATING_DASHBOARD.html"
      - "docs/design/APPROVED_OMENWARD_BUILDING_TIER_REALIGNMENT_2026-08-06.md"
      - "docs/design/APPROVED_OMENWARD_FIRST5_FTUE_MASTERY_LADDER_2026-08-20.md"
      - "docs/design/APPROVED_OMENWARD_FORWARD_DEFENSE_AND_OCCUPATION_NODE_CONTRACT_2026-08-28.md"
      - "docs/images/planning/OMENWARD_FORWARD_DEFENSE_OCCUPATION_NODE_STRATEGIC_MAP_CANDIDATE_2026-08-28.md"
      - "docs/images/planning/generated/OMENWARD_PROJECT_CORE_SCENE_VISUAL_BOARD_2026-08-28_v5_FORWARD_DEFENSE_OCCUPATION_NODES.png"
      - "docs/images/VISUAL_REFERENCE_INDEX.md"
      - "docs/migrations/OMENWARD_NOTION_CURRENT_CONTENT_TO_REPOSITORY_MIGRATION_2026-08-28.md"
      - "docs/audits/OMENWARD_GENERATED_OPERATING_ARTIFACT_EOL_INCIDENT_2026-08-28.md"
      - "docs/analysis/barracks_simulation/**"
      - "docs/design/APPROVED_OMENWARD_BARRACKS_CAPABILITY_PROXY_AND_MULTI_SPECIAL_TOKEN_BURST_REMEDIATION_2026-08-08.md"
      - "docs/design/APPROVED_OMENWARD_BARRACKS_REMEDIATION_SMOKE_RERUN_RESULTS_2026-08-08.md"
      - "docs/design/APPROVED_OMENWARD_BARRACKS_SMOKE_SWEEP_RESULTS_2026-08-06.md"
      - "docs/design/APPROVED_OMENWARD_BARRACKS_10000_SEED_DECISION_SWEEP_REVIEW_2026-08-08.md"
      - "docs/design/APPROVED_OMENWARD_BARRACKS_PARAMETER_SELECTION_OBSERVABLES_2026-08-08.md"
      - "docs/design/APPROVED_OMENWARD_BARRACKS_10000_SEED_ROBUSTNESS_ONLY_REVIEW_2026-08-08.md"
      - "docs/design/APPROVED_OMENWARD_BARRACKS_10000_SEED_ROBUSTNESS_EXECUTION_RESULTS_2026-08-09.md"
      - "docs/design/APPROVED_OMENWARD_BARRACKS_FUNCTIONAL_VALUE_COMBAT_NUMERICS_DEFINITION_REVIEW_2026-08-09.md"
      - "docs/design/APPROVED_OMENWARD_BARRACKS_FUNCTIONAL_VALUE_MEASUREMENT_SCENARIOS_2026-08-09.md"
      - "docs/operations/ACTIVE_INTEGRATED_CONTRACT_STATE.v1.json"
      - "docs/operations/ACTIVE_INTEGRATED_CONTRACT_STATE.v2.json"
      - "docs/operations/CANON_FRESHNESS_V45_SHEET_SYNC_EVIDENCE_2026-08-11.json"
      - "docs/operations/GODOT_CSV_IMPORT_ARTIFACT_HYGIENE_STATE.v1.json"
      - "docs/operations/GODOT_LOCAL_EXECUTOR_CHECKPOINT.v1.json"
      - "docs/process/ACTIVE_INTEGRATED_CONTRACT_BINDING_2026-08-06.md"
      - "docs/process/ACTIVE_INTEGRATED_CONTRACT_BINDING_2026-08-11.md"
      - "docs/process/APPROVED_OMENWARD_CANON_FRESHNESS_AND_V4_5_THIN_ADAPTER_2026-08-11.md"
      - "docs/process/APPROVED_OMENWARD_REPOSITORY_ONLY_CANON_AND_NOTION_RETIREMENT_2026-08-28.md"
      - "docs/process/APPROVED_OMENWARD_GODOT_AI_3_1_3_HERA_GUT_USER_APPROVAL_AND_REMOTE_SYNC_RECONCILIATION_2026-08-09.md"
      - "docs/process/APPROVED_OMENWARD_GODOT_CSV_IMPORT_ARTIFACT_HYGIENE_2026-08-09.md"
      - "docs/process/GODOT_LOCAL_EXECUTOR_HANDOFF_2026-08-09.md"
      - "docs/superpowers/plans/2026-08-09-godot-csv-import-artifact-hygiene.md"
      - "docs/superpowers/plans/2026-08-11-canon-freshness-v45-routing.md"
      - "skills/PROJECT_BASE_ADAPTER.json"
      - "skills/PROJECT_SKILL_SNAPSHOT.json"
      - "skills/BASE_V9_ADAPTER.json"
      - "skills/PROJECT_BASE_SKILL_ADAPTER.json"
      - "tests/python/test_active_integrated_contract_v4_4.py"
      - "tests/python/test_canon_freshness_v45_routing.py"
      - "tests/python/test_canon_freshness_v45_scope.py"
      - "tests/python/test_tool_state_user_approval_remote_sync.py"
      - "tests/python/test_godot_csv_import_artifact_hygiene.py"
      - "tests/python/test_barracks_conditional_fail_remediation.py"
      - "tests/python/test_barracks_remediation_smoke.py"
      - "tests/python/test_barracks_10000_decision_sweep_review.py"
      - "tests/python/test_barracks_parameter_selection_observables.py"
      - "tests/python/test_barracks_10000_robustness_review.py"
      - "tests/python/test_barracks_10000_robustness_execution.py"
      - "tests/python/test_barracks_functional_value_combat_numerics_review.py"
      - "tests/python/test_barracks_functional_value_measurement_scenarios.py"
      - "tests/python/test_project_base_adapter_freshness.py"
      - "tools/validate_active_integrated_contract_v4_4.py"
      - "tools/validate_canon_freshness_v45_scope.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contract-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install simulator dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Enforce bounded non-product planning scope
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${GITHUB_BASE_REF}"...HEAD | grep -Eq '^(scripts/|scenes/|data/|assets/|addons/|project\.godot$)'; then
            echo "Historical v4.4 planning scope does not own approved protected implementation changes."
            exit 0
          fi
          if python tools/validate_canon_freshness_v45_scope.py \
            --base "origin/${GITHUB_BASE_REF}" \
            --head HEAD; then
            echo "v4.5 bounded canon freshness transition scope=PASS"
            exit 0
          fi

          python - <<'PY'
          import os
          import subprocess

          allowed = {
              ".github/workflows/validate-active-integrated-contract-v4-4.yml",
              ".github/workflows/validate-tool-state-user-approval-remote-sync.yml",
              ".github/workflows/validate-godot-csv-import-artifact-hygiene.yml",
              ".gitignore",
              ".gitattributes",
              "docs/PROJECT_CANON_DECISION_LEDGER.md",
              "docs/DECISIONS_PENDING.md",
              "docs/PROJECT_OPERATING_DASHBOARD.html",
              "docs/audits/OMENWARD_GENERATED_OPERATING_ARTIFACT_EOL_INCIDENT_2026-08-28.md",
              "docs/audits/OMENWARD_STAGE1_FTUE_CANON_DRIFT_INCIDENT_2026-08-28.md",
              "docs/process/APPROVED_OMENWARD_GODOT_AI_3_1_3_HERA_GUT_USER_APPROVAL_AND_REMOTE_SYNC_RECONCILIATION_2026-08-09.md",
              "docs/process/APPROVED_OMENWARD_GODOT_CSV_IMPORT_ARTIFACT_HYGIENE_2026-08-09.md",
              "docs/process/APPROVED_OMENWARD_REPOSITORY_ONLY_CANON_AND_NOTION_RETIREMENT_2026-08-28.md",
              "docs/process/GODOT_LOCAL_EXECUTOR_HANDOFF_2026-08-09.md",
              "docs/operations/ACTIVE_INTEGRATED_CONTRACT_STATE.v1.json",
              "docs/operations/GODOT_CSV_IMPORT_ARTIFACT_HYGIENE_STATE.v1.json",
              "docs/operations/GODOT_LOCAL_EXECUTOR_CHECKPOINT.v1.json",
              "docs/process/ACTIVE_INTEGRATED_CONTRACT_BINDING_2026-08-06.md",
              "docs/superpowers/plans/2026-08-09-godot-csv-import-artifact-hygiene.md",
              "skills/PROJECT_BASE_ADAPTER.json",
              "skills/PROJECT_SKILL_SNAPSHOT.json",
              "skills/BASE_V9_ADAPTER.json",
              "skills/PROJECT_BASE_SKILL_ADAPTER.json",
              "tests/python/test_active_integrated_contract_v4_4.py",
              "tests/python/test_tool_state_user_approval_remote_sync.py",
              "tests/python/test_godot_csv_import_artifact_hygiene.py",
              "tests/python/test_barracks_functional_value_measurement_scenarios.py",
              "tests/python/test_project_base_adapter_freshness.py",
              "tools/validate_active_integrated_contract_v4_4.py",
              "README.md",
              "docs/PROJECT_HOME.md",
              "docs/ACTIVE_CONTEXT.md",
              "docs/CURRENT_CONFIRMED_DECISIONS.md",
              "docs/CURRENT_IMPLEMENTATION_STATUS.md",
              "docs/DECISIONS_PENDING.md",
              "docs/DOCUMENTATION_MAP.md",
              "docs/DOCUMENT_LIFECYCLE_REGISTRY.md",
              "docs/HANDOFF_CONTEXT.md",
              "docs/OMENWARD_GDD_CURRENT_CANON.md",
              "docs/ONBOARDING_PLANNING_CURRENT_AUTHORITY.md",
              "docs/OMENWARD_ROADMAP.md",
              "docs/PROJECT_CANON_DECISION_LEDGER.md",
              "docs/PROJECT_CORE.md",
              "docs/images/VISUAL_REFERENCE_INDEX.md",
              "docs/migrations/OMENWARD_NOTION_CURRENT_CONTENT_TO_REPOSITORY_MIGRATION_2026-08-28.md",
              "docs/design/OMENWARD_TARGET_SCREEN_SURFACE_AND_VISUAL_COVERAGE_AUDIT_2026-08-27.md",
              "docs/design/APPROVED_OMENWARD_BUILDING_TIER_REALIGNMENT_2026-08-06.md",
              "docs/design/APPROVED_OMENWARD_FIRST5_FTUE_MASTERY_LADDER_2026-08-20.md",
              "docs/design/APPROVED_OMENWARD_FORWARD_DEFENSE_AND_OCCUPATION_NODE_CONTRACT_2026-08-28.md",
              "docs/images/planning/OMENWARD_FORWARD_DEFENSE_OCCUPATION_NODE_STRATEGIC_MAP_CANDIDATE_2026-08-28.md",
              "docs/images/planning/generated/OMENWARD_PROJECT_CORE_SCENE_VISUAL_BOARD_2026-08-28_v5_FORWARD_DEFENSE_OCCUPATION_NODES.png",
              "tests/python/test_bca_visual_sheet_adoption.py",
              "tests/python/test_c3_core_ux_contract.py",
              "tests/python/test_canon_freshness_v45_routing.py",
              "tests/python/test_canon_freshness_v45_scope.py",
              "tests/python/test_content_closure_benchmark_first.py",
              "tests/python/test_current_canon_reconciliation_20260821.py",
              "tests/python/test_current_v48_router_sync.py",
              "tests/python/test_phase_b_final_planning_review.py",
              "tests/python/test_project_core_docs.py",
              "tests/python/test_phase_b_final_planning_review.py",
              "tests/python/test_quality_guardrails_elite_boss_cadence.py",
              "tests/python/test_run_command_implementation_authority_scope.py",
              "tools/validate_c1_roulette.py",
              "tools/validate_c2_battle_objective.py",
              "tools/validate_c3_core_ux.py",
              "tools/validate_canon_freshness_v45_scope.py",
              "tools/validate_project_core_docs.py",
          }
          base_ref = os.environ.get("GITHUB_BASE_REF", "main")
          base = f"origin/{base_ref}"
          changed = set(subprocess.check_output(["git", "diff", "--name-only", f"{base}...HEAD"], text=True).splitlines())
          generated_hygiene = {
              path for path in changed
              if path.startswith("docs/analysis/barracks_simulation/")
              and (path.endswith(".csv.import") or path.endswith(".translation"))
          }
          unexpected = sorted(changed - allowed - generated_hygiene)
          if unexpected:
              raise SystemExit(f"scope mismatch unexpected={unexpected}")
          protected_prefixes = ("data/", "scripts/", "scenes/", "assets/", "addons/")
          protected = sorted(path for path in changed if path == "project.godot" or path.startswith(protected_prefixes))
          if protected:
              raise SystemExit(f"protected product paths changed={protected}")
          print(f"v4.4 bounded planning scope=PASS files={len(changed)} protected_product_paths=0")
          PY

      - name: Compile v4.4 and focused contracts
        run: |
          python -m py_compile \
            tools/validate_active_integrated_contract_v4_4.py \
            tools/validate_canon_freshness_v45_scope.py \
            tests/python/test_active_integrated_contract_v4_4.py \
            tests/python/test_canon_freshness_v45_routing.py \
            tests/python/test_canon_freshness_v45_scope.py \
            tests/python/test_tool_state_user_approval_remote_sync.py \
            tests/python/test_godot_csv_import_artifact_hygiene.py \
            tests/python/test_barracks_conditional_fail_remediation.py \
            tests/python/test_barracks_10000_decision_sweep_review.py \
            tests/python/test_barracks_parameter_selection_observables.py \
            tests/python/test_barracks_10000_robustness_review.py \
            tests/python/test_barracks_10000_robustness_execution.py \
            tests/python/test_barracks_functional_value_combat_numerics_review.py \
            tests/python/test_barracks_functional_value_measurement_scenarios.py \
            tests/python/test_project_base_adapter_freshness.py

      - name: Run v4.4 and durable-gate tests
        run: |
          python -m unittest \
            tests.python.test_active_integrated_contract_v4_4 \
            tests.python.test_canon_freshness_v45_routing \
            tests.python.test_canon_freshness_v45_scope \
            tests.python.test_tool_state_user_approval_remote_sync \
            tests.python.test_godot_csv_import_artifact_hygiene \
            tests.python.test_barracks_conditional_fail_remediation \
            tests.python.test_barracks_10000_decision_sweep_review \
            tests.python.test_barracks_parameter_selection_observables \
            tests.python.test_barracks_10000_robustness_review \
            tests.python.test_barracks_10000_robustness_execution \
            tests.python.test_barracks_functional_value_combat_numerics_review \
            tests.python.test_barracks_functional_value_measurement_scenarios \
            tests.python.test_project_base_adapter_freshness

      - name: Validate v4.4 historical binding regression
        run: python tools/validate_active_integrated_contract_v4_4.py
